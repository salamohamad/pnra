<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Facebook-annonsförhandsvisningar för Pensionera.">
  <title>Pensionera | Facebook Ad Preview</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f0f2f5;
      --surface: #ffffff;
      --text: #050505;
      --muted: #65676b;
      --line: #ced0d4;
      --soft-line: #e4e6eb;
      --hover: #f2f2f2;
      --blue: #0866ff;
      --pink: #ff2a8b;
      --navy: #17194c;
      --shadow: 0 2px 12px rgb(0 0 0 / 8%);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    a {
      font: inherit;
    }

    .topbar {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 10px clamp(18px, 4vw, 52px);
      border-bottom: 1px solid var(--soft-line);
      background: rgb(255 255 255 / 94%);
      box-shadow: 0 1px 6px rgb(0 0 0 / 6%);
      backdrop-filter: blur(14px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark,
    .page-avatar {
      display: block;
      flex: 0 0 auto;
      overflow: hidden;
      border: 1px solid rgb(0 0 0 / 9%);
      border-radius: 50%;
      background: white;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      box-shadow: 0 5px 16px rgb(23 25 76 / 18%);
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-title {
      margin: 0;
      font-size: 17px;
      letter-spacing: -0.2px;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .count {
      padding: 7px 11px;
      border-radius: 999px;
      background: #e7f3ff;
      color: #0059c9;
      font-size: 13px;
      font-weight: 700;
    }

    main {
      width: min(100%, 1180px);
      margin: 0 auto;
      padding: clamp(26px, 5vw, 58px) clamp(14px, 3vw, 28px) 72px;
    }

    .intro {
      max-width: 680px;
      margin: 0 auto clamp(24px, 4vw, 38px);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--pink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(29px, 5vw, 48px);
      letter-spacing: -1.5px;
      line-height: 1.05;
    }

    .intro-copy {
      margin: 14px auto 0;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 17px);
      line-height: 1.5;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 500px));
      justify-content: center;
      gap: clamp(20px, 3vw, 32px);
      align-items: start;
    }

    .ad-shell {
      overflow: hidden;
      border: 1px solid #dddfe2;
      border-radius: 10px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .ad-header {
      display: flex;
      align-items: flex-start;
      padding: 12px 16px 10px;
    }

    .page-avatar {
      width: 40px;
      height: 40px;
      margin-right: 9px;
    }

    .page-details {
      min-width: 0;
      flex: 1;
    }

    .page-name {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 19px;
      text-decoration: none;
    }

    .verified {
      display: inline-grid;
      width: 14px;
      height: 14px;
      place-items: center;
      border-radius: 50%;
      background: var(--blue);
      color: white;
      font-size: 9px;
    }

    .sponsored {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 1px;
      color: var(--muted);
      font-size: 13px;
      line-height: 16px;
    }

    .globe {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .more {
      width: 36px;
      height: 36px;
      margin: -3px -8px 0 5px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      cursor: default;
      font-size: 25px;
      line-height: 1;
    }

    .ad-copy {
      min-height: 65px;
      margin: 0;
      padding: 0 16px 12px;
      font-size: 15px;
      line-height: 1.35;
    }

    .creative-wrap {
      border-top: 1px solid var(--soft-line);
      background: #ececec;
    }

    .creative {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: cover;
    }

    .link-card {
      display: flex;
      min-height: 86px;
      align-items: center;
      gap: 16px;
      padding: 13px 16px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--soft-line);
      background: #f5f6f7;
    }

    .link-details {
      min-width: 0;
      flex: 1;
    }

    .link-title {
      display: -webkit-box;
      overflow: hidden;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      line-height: 22px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .cta {
      display: inline-flex;
      flex: 0 0 auto;
      min-width: 104px;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 11px 17px;
      border: 0;
      border-radius: 8px;
      background: #e1e4e8;
      color: #050505;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
    }

    .cta:hover {
      background: #d8dbe0;
    }

    .social-proof {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      margin: 0 16px;
      border-bottom: 1px solid var(--soft-line);
      color: var(--muted);
      font-size: 14px;
    }

    .reactions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reaction-icons {
      display: flex;
    }

    .reaction {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      margin-right: -3px;
      border: 2px solid white;
      border-radius: 50%;
      color: white;
      font-size: 10px;
    }

    .like {
      background: var(--blue);
    }

    .heart {
      background: #f55368;
    }

    .engagement {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px 10px;
    }

    .engagement span {
      display: flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .engagement svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }

    .footer-note {
      margin: 34px auto 0;
      color: #7d7f84;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 860px) {
      .preview-grid {
        grid-template-columns: minmax(0, 500px);
      }
    }

    @media (max-width: 540px) {
      .topbar {
        min-height: 58px;
        padding: 8px 13px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        font-size: 21px;
      }

      .brand-title {
        font-size: 15px;
      }

      .brand-subtitle {
        display: none;
      }

      main {
        padding: 28px 0 50px;
      }

      .intro {
        padding: 0 20px;
      }

      .ad-shell {
        border-right: 0;
        border-left: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

    function renderAd(ad, index) {
      const likes = 18 + ((index * 7) % 29);
      const comments = 2 + (index % 6);
      const loading = index < 2 ? "eager" : "lazy";

      return `
        <article class="ad-shell">

          </div>

          <div class="link-card">
            <div class="link-details">
              <p class="link-title">${ad.title}</p>
            </div>
            <a class="cta" href="${ad.url}" target="_blank" rel="noopener noreferrer">Läs mer</a>

            <span>${engagementIcons.comment} Kommentera</span>
            <span>${engagementIcons.share} Dela</span>

    }

    document.getElementById("preview-grid").innerHTML = ads.map(renderAd).join("");
    document.getElementById("ad-count").textContent = `${ads.length} annonser`;
